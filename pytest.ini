[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=focused_crawler
    --cov-report=term-missing
    --cov-report=html:htmlcov
log_cli = true
log_cli_level = WARNING
markers =
    unit: Schnelle Unit-Tests ohne Netzwerk
    integration: Tests mit echten HTTP-Requests (brauchen Internet)
    slow: Länger dauernde Tests
